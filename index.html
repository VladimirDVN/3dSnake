<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="application-name" content="3dSnake">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="3dSnake">
	<meta name="description" content="Познакомиться с 3D games">
	<meta name="theme-color" content="#11a8a3">	
	<link rel="icon" type="image/x-icon" href="favicon.ico">
	<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
	<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">
	<link rel="apple-touch-icon" href="icons/icon-192x192.png">
	<link rel="manifest" href="manifest.json">
	<script>
	   if ('serviceWorker' in navigator) {
		  navigator.serviceWorker.register('sw.js')
		  .then(function(registration) {
						console.log('Registration successful, scope is:', registration.scope);
					})
					.catch(function(error) {
						console.log('Service worker registration failed, error:', error);
					});
	   }
	</script>
</head>
	  <style>
		* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #000000 0%, #000000 100%);
        }
        .menu-panel {
            position: fixed;
            top: 0;
            right: -300px; /* Скрыто за пределами экрана */
            width: 300px;
            height: 100vh;
            background: rgba(0,0, 0, 0);
            backdrop-filter: blur(10px);
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .menu-panel.active {
            right: 0; /* Показываем меню */
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 40px;
        }

        .menu-button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #00bfff, #00bfff);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            min-width: 120px;
            text-align: center;
        }

        .menu-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #00bfff, #00bf00);
        }

        .menu-button:active {
            transform: translateY(-1px);
        }
      </style>
	</head>
<body>
    <div class="menu-panel" id="menuPanel">
        <div class="menu-container">
            <button class="menu-button" onclick="handleMenuClick('←')">←</button>
            <button class="menu-button" onclick="handleMenuClick('→')">→</button>
            <button class="menu-button" onclick="handleMenuClick('↑')">↑</button>
            <button class="menu-button" onclick="handleMenuClick('↓')">↓</button>
            <button class="menu-button" onclick="handleMenuClick('w')">w</button>
            <button class="menu-button" onclick="handleMenuClick('s')">s</button>
        </div>
    </div>
	<script type="module" src="dist/main-out.js"></script>
</body>
</html>
